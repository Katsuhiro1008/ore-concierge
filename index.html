<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>俺コンシェルジュ</title>
<style>
:root{--bg:#fff;--text:#171717;--sub:#777;--line:#e9e9e9;--soft:#f5f5f5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
button,input{font:inherit}
.app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:82px}
header{padding:28px 22px 6px;font-size:14px;color:var(--sub)}
main{padding:18px 22px}
h1{font-size:30px;letter-spacing:-.04em;margin:8px 0 5px}
h2{font-size:18px;margin:34px 0 14px}
.small{color:var(--sub);font-size:13px;line-height:1.6}
.input{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:18px;padding:8px 9px 8px 16px;margin-top:28px}
.input input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px;color:var(--text);padding:8px 0}
.send{flex:0 0 auto;width:38px;height:38px;border:0;border-radius:50%;background:#171717;color:#fff;font-size:18px}
.quick{display:flex;flex-wrap:wrap;gap:9px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:14px;color:#171717}
.rec{padding:15px 0;border-bottom:1px solid var(--line)}
.rec b{font-size:15px}.rec span{display:block;color:var(--sub);font-size:13px;margin-top:5px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav button{border:0;background:none;padding:11px 30px 10px;color:#888;font-size:12px}
nav button.active{color:#171717;font-weight:600}
nav .ico{display:block;font-size:20px;line-height:20px;margin-bottom:2px}
.page{display:none}.page.active{display:block}
.chat{min-height:70vh;display:flex;flex-direction:column}
.messages{flex:1;padding:5px 0 20px}
.msg{max-width:84%;padding:12px 14px;border-radius:16px;margin:10px 0;font-size:15px;line-height:1.55;white-space:pre-wrap}
.ai{background:var(--soft)}.me{background:#171717;color:#fff;margin-left:auto}
.chatbar{position:sticky;bottom:70px;background:#fff;padding:8px 0;display:flex;gap:8px}
.profile-row{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}
.profile-row span{color:var(--sub);text-align:right}
.memory{margin-top:12px;padding:16px;background:var(--soft);border-radius:15px;line-height:1.65;font-size:14px}
</style>
</head>
<body>
<div class="app">
<header>俺コンシェルジュ</header>

<section id="home" class="page active">
<main>
<h1>今日はどうする？</h1>
<p class="small">あなたの好みをもとに、一緒に決めます。</p>

<div class="input">
<input id="homeInput" autocomplete="off" placeholder="今から何しよう？">
<button class="send" onclick="startChat()">↑</button>
</div>

<h2>すぐ相談する</h2>
<div class="quick">
<button onclick="quick('今から何しよう？')">今から何しよう？</button>
<button onclick="quick('土曜どうする？')">土曜どうする？</button>
<button onclick="quick('一人旅行したい')">一人旅行したい</button>
<button onclick="quick('町田で店を探して')">町田で店を探して</button>
</div>

<h2>今日のおすすめ</h2>
<div class="rec"><b>静かな場所で過ごす</b><span>落ち着いた空間を好む傾向から</span></div>
<div class="rec"><b>新しい店を開拓する</b><span>過去の評価が高い傾向から</span></div>
</main>
</section>

<section id="chat" class="page">
<main class="chat">
<div id="messages" class="messages">
<div class="msg ai">どうした？</div>
</div>
<div class="chatbar">
<div class="input" style="margin:0;flex:1">
<input id="chatInput" autocomplete="off" placeholder="メッセージ" onkeydown="if(event.key==='Enter')send()">
<button class="send" onclick="send()">↑</button>
</div>
</div>
</main>
</section>

<section id="profile" class="page">
<main>
<h1>自分</h1>
<p class="small">今の俺コンシェルジュの理解</p>

<h2>あなたの好み</h2>
<div class="profile-row"><b>食事</b><span>和食・落ち着いた店</span></div>
<div class="profile-row"><b>雰囲気</b><span>静か・ゆっくりできる</span></div>
<div class="profile-row"><b>休日</b><span>旅行・映画・街歩き</span></div>

<h2>AIから見た自分</h2>
<div class="memory">静かな空間や非日常感を好み、食事では料理だけでなく雰囲気も重視する傾向があります。</div>

<h2>記憶</h2>
<div class="profile-row"><b>行った店</b><span>まだありません</span></div>
<div class="profile-row"><b>行きたい店</b><span>まだありません</span></div>
<div class="profile-row"><b>旅行履歴</b><span>まだありません</span></div>
</main>
</section>

<nav>
<button class="active" onclick="showPage('home',this)"><span class="ico">⌂</span>ホーム</button>
<button onclick="showPage('chat',this)"><span class="ico">◌</span>AI</button>
<button onclick="showPage('profile',this)"><span class="ico">○</span>自分</button>
</nav>
</div>

<script>
function showPage(id,btn){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  window.scrollTo(0,0);
}
function quick(text){
  document.getElementById('homeInput').value=text;
  startChat();
}
function startChat(){
  const input=document.getElementById('homeInput');
  const text=input.value.trim() || '今から何しよう？';
  document.getElementById('chatInput').value=text;
  showPage('chat',document.querySelectorAll('nav button')[1]);
  send();
}
function addMessage(text,type){
  const el=document.createElement('div');
  el.className='msg '+type;
  el.textContent=text;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'end'});
}
function send(){
  const input=document.getElementById('chatInput');
  const text=input.value.trim();
  if(!text)return;
  addMessage(text,'me');
  input.value='';
  setTimeout(()=>addMessage(reply(text),'ai'),350);
}
function reply(text){
  if(text.includes('町田')){
    return '町田で探すなら、人数・時間・予算・雰囲気を整理して、あなたの過去の好みに合う店を3つくらいに絞るのがよさそう。\n\n次の版では、実際の店舗情報を検索して候補を出せるようにする。';
  }
  if(text.includes('旅行')){
    return '旅行なら、日数・予算・人数・移動時間・非日常感を軸に候補を出す。\n\nあなた向けには、自然・静かな宿・その土地ならではの食を優先する設計にできる。';
  }
  if(text.includes('土曜')){
    return '土曜なら、今の気分・予算・使える時間をもとに3案に絞るのがよさそう。\n\n次の版では天気やイベントも考慮できるようにする。';
  }
  return '今の相談をもとに、あなたの好みを考慮した候補を整理する。\n\nv0.1では仮回答だけど、次の版で本物のAIにつなげられる。';
}
</script>
</body>
</html>
